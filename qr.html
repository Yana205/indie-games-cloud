<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indie Games Cloud QR</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Printable A4 poster. Print with "Background graphics" on for the soft bubbles. */
    @page { size: A4; margin: 0; }
    :root { --ink: #1d1915; --muted: #6d655b; --accent: #d97757; --accent-2: #f0b294; --paper: #fffdf9; --line: #eadfd3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9e3da; color: var(--ink); font-family: "Inter", system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet {
      position: relative; overflow: hidden; width: 210mm; height: 297mm; margin: 24px auto;
      background: var(--paper); box-shadow: 0 20px 60px rgba(60, 40, 20, 0.18);
      display: flex; flex-direction: column; align-items: center; text-align: center; padding: 22mm 20mm 16mm;
    }
    .bubble { position: absolute; border-radius: 50%; pointer-events: none; }
    .b1 { width: 92mm; height: 92mm; left: -30mm; top: -26mm; background: radial-gradient(circle at 35% 30%, #fbe3d6, #f4c3aa 70%); opacity: .55; }
    .b2 { width: 46mm; height: 46mm; right: -12mm; top: 30mm; background: radial-gradient(circle at 35% 30%, #fde9de, #f0b294 75%); opacity: .5; }
    .b3 { width: 70mm; height: 70mm; right: -24mm; bottom: -20mm; background: radial-gradient(circle at 35% 30%, #fbe3d6, #e8a07f 75%); opacity: .4; }
    .b4 { width: 18mm; height: 18mm; left: 18mm; bottom: 46mm; background: radial-gradient(circle at 35% 30%, #fff, #f0b294 80%); opacity: .55; }
    .b5 { width: 10mm; height: 10mm; right: 36mm; top: 92mm; background: radial-gradient(circle at 35% 30%, #fff, #e8a07f 80%); opacity: .6; }
    .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; height: 100%; width: 100%; }
    .brand { display: flex; align-items: center; gap: 4mm; }
    .brand svg { width: 13mm; height: 13mm; }
    .eyebrow { font-size: 10.5pt; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    h1 { margin: 6mm 0 0; font: 400 64pt/0.9 "Instrument Serif", Georgia, serif; letter-spacing: -0.01em; }
    h1 em { color: var(--accent); }
    .tagline { margin: 6mm 0 0; font: italic 400 22pt/1.15 "Instrument Serif", Georgia, serif; color: var(--ink); }
    .qr-wrap {
      position: relative; margin-top: 12mm; padding: 9mm; border-radius: 12mm;
      background: #fff; border: 1.2mm solid var(--accent); box-shadow: 0 10mm 24mm rgba(217, 119, 87, 0.22);
    }
    .qr-code { display: block; width: 92mm; height: 92mm; }
    .drop {
      position: absolute; top: -9mm; left: 50%; width: 16mm; height: 16mm; margin-left: -8mm;
      display: grid; place-items: center; border-radius: 50%; background: var(--accent); border: 1.4mm solid var(--paper);
    }
    .drop svg { width: 7mm; height: 7mm; fill: #fff; }
    .steps { display: flex; gap: 6mm; margin-top: 13mm; }
    .step { width: 50mm; display: flex; flex-direction: column; align-items: center; gap: 2.5mm; }
    .step b {
      display: grid; place-items: center; width: 10mm; height: 10mm; border-radius: 50%;
      background: var(--ink); color: var(--paper); font-size: 12pt; font-weight: 600;
    }
    .step span { font-size: 12.5pt; line-height: 1.3; font-weight: 500; }
    .step small { display: block; color: var(--muted); font-weight: 400; font-size: 10.5pt; }
    .url { margin-top: auto; font-size: 13pt; font-weight: 600; letter-spacing: .01em; }
    .url span { color: var(--accent); }
    .credit { margin-top: 3mm; font-size: 9.5pt; color: var(--muted); }
    @media print {
      html, body { background: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 840px) {
      .sheet { transform-origin: top left; zoom: calc(100vw / 840px); }
    }
  </style>
</head>
